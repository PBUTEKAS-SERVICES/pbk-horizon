<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PBK Horizon — Gestion de Stock</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #18202c;
      --muted: #5c687a;
      --primary: #0f4c81;
      --primary-hover: #0a365c;
      --danger: #c62828;
      --danger-bg: #fdecea;
      --ok: #1e7e34;
      --ok-bg: #eaf6ed;
      --border: #dfe4ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container { max-width: 920px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      align-items: end;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-sm { padding: 5px 10px; font-size: 0.85rem; }
    .btn-plus { background: var(--ok-bg); color: var(--ok); border: 1px solid #b7e1c2; }
    .btn-minus { background: #fff4e5; color: #9a5b00; border: 1px solid #f5d09c; }
    .btn-del { background: var(--danger-bg); color: var(--danger); border: 1px solid #f5c2c0; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .search-box { max-width: 280px; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }
    th { color: var(--muted); font-size: 0.82rem; text-transform: uppercase; }
    .badge-low {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .badge-ok {
      background: var(--ok-bg);
      color: var(--ok);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    #status { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>PBK Horizon</h1>
        <div class="subtitle">Suivi du stock en temps réel — PBUTEKAS-SERVICES</div>
      </div>
    </header>

    <div class="card">
      <form id="product-form" class="grid-form">
        <div>
          <label for="nom">Nom du produit</label>
          <input id="nom" type="text" placeholder="Ex. Cahier A4" required />
        </div>
        <div>
          <label for="quantite">Quantité initiale</label>
          <input id="quantite" type="number" min="0" value="0" required />
        </div>
        <div>
          <label for="seuil">Seuil d'alerte</label>
          <input id="seuil" type="number" min="0" value="5" required />
        </div>
        <div>
          <label for="prix">Prix unitaire</label>
          <input id="prix" type="number" min="0" step="0.01" value="0" required />
        </div>
        <div>
          <button type="submit" class="btn-primary" style="width:100%;">+ Ajouter</button>
        </div>
      </form>
      <div id="status">En attente de configuration Supabase...</div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input id="search" class="search-box" type="search" placeholder="Rechercher un produit..." />
        <button id="refresh-btn" class="btn-sm btn-primary" type="button">Actualiser</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Produit</th>
              <th>Quantité</th>
              <th>Prix</th>
              <th>État</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="stock-body">
            <tr><td colspan="5">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hhqdulyklgmnxuoehfql.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_HFyz52SLbwEPIyoPtkxECQ_oMf6Ydgc";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let produitsCache = [];

    const statusEl = document.getElementById("status");
    const tbody = document.getElementById("stock-body");
    const form = document.getElementById("product-form");
    const searchInput = document.getElementById("search");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? "#c62828" : "#5c687a";
    }

    function renderTable() {
      const filtre = searchInput.value.trim().toLowerCase();
      const liste = produitsCache.filter(p => p.nom.toLowerCase().includes(filtre));

      if (!liste.length) {
        tbody.innerHTML = '<tr><td colspan="5">Aucun produit trouvé.</td></tr>';
        return;
      }

      tbody.innerHTML = liste.map(p => {
        const estBas = Number(p.quantite) <= Number(p.seuil_alerte);
        const badge = estBas
          ? `<span class="badge-low">Stock bas (≤ ${p.seuil_alerte})</span>`
          : `<span class="badge-ok">OK</span>`;
        return `
          <tr>
            <td><strong>${escapeHtml(p.nom)}</strong></td>
            <td><strong>${p.quantite}</strong></td>
            <td>${Number(p.prix).toFixed(2)}</td>
            <td>${badge}</td>
            <td>
              <div class="actions">
                <button class="btn-sm btn-plus" onclick="changerQuantite(${p.id}, ${Number(p.quantite) + 1})">+1</button>
                <button class="btn-sm btn-minus" onclick="changerQuantite(${p.id}, ${Math.max(0, Number(p.quantite) - 1)})">-1</button>
                <button class="btn-sm btn-del" onclick="supprimerProduit(${p.id})">Supprimer</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function chargerProduits() {
      if (SUPABASE_ANON_KEY === "VOTRE_CLE_ANON_PUBLIC") {
        setStatus("Collez votre clé anon public dans SUPABASE_ANON_KEY.", true);
        tbody.innerHTML = '<tr><td colspan="5">Clé anon public requise.</td></tr>';
        return;
      }
      setStatus("Synchronisation avec Supabase...");
      const { data, error } = await sb
        .from("produits")
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        setStatus("Erreur de chargement : " + error.message, true);
        return;
      }
      produitsCache = data || [];
      setStatus("Connecté à Supabase (" + produitsCache.length + " produit(s)).");
      renderTable();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nom = document.getElementById("nom").value.trim();
      const quantite = parseInt(document.getElementById("quantite").value, 10) || 0;
      const seuil_alerte = parseInt(document.getElementById("seuil").value, 10) || 0;
      const prix = parseFloat(document.getElementById("prix").value) || 0;

      if (!nom) return;
      const { error } = await sb.from("produits").insert([{ nom, quantite, seuil_alerte, prix }]);
      if (error) {
        setStatus("Erreur ajout : " + error.message, true);
        return;
      }
      form.reset();
      document.getElementById("quantite").value = 0;
      document.getElementById("seuil").value = 5;
      document.getElementById("prix").value = 0;
      await chargerProduits();
    });

    async function changerQuantite(id, nouvelleQuantite) {
      const { error } = await sb
        .from("produits")
        .update({ quantite: nouvelleQuantite })
        .eq("id", id);
      if (error) {
        setStatus("Erreur mise à jour : " + error.message, true);
        return;
      }
      await chargerProduits();
    }

    async function supprimerProduit(id) {
      const { error } = await sb.from("produits").delete().eq("id", id);
      if (error) {
        setStatus("Erreur suppression : " + error.message, true);
        return;
      }
      await chargerProduits();
    }

    searchInput.addEventListener("input", renderTable);
    document.getElementById("refresh-btn").addEventListener("click", chargerProduits);

    chargerProduits();
  </script>
</body>
</html>
